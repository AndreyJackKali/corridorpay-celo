name: CorridorPay CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run full CorridorPay test suite (Celo Mainnet RPC + Textile FX v2 + Altana SDK + ERC-8021)
        run: npm test

      - name: Verify counterfactual Altana wallet & ERC-8021 attribution suffix
        run: npm run wallet

      - name: Verify live Textile FX multi-corridor settlement plan
        run: npm run plan
